[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "serialhub"
version = "0.1.0"
description = "常驻串口中枢 serialhub：持久多口 + 每口环形缓冲(毫秒时间戳/全局序号) + Web UI(xterm ANSI) + TCP 桥 + MCP，对 AI agent 极友好"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "STM32H750 Smart Home Terminal" }]
keywords = ["serial", "uart", "mcp", "web-ui", "agent", "xterm", "daemon"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
    "pyserial>=3.5",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pyyaml>=6.0",
    "websockets>=12",
]

[project.optional-dependencies]
# MCP server（官方 mcp SDK；1.x 用 FastMCP，2.x 用 MCPServer，本工程带兼容垫片）
mcp = ["mcp>=1.9"]
dev = ["pytest>=7.0", "httpx>=0.27", "mcp>=1.9"]

[project.scripts]
serialhub = "serialhub.cli:main"

[project.urls]
Homepage = "https://github.com/cjznb/stm32h750-smart-home-terminal"

[tool.setuptools.packages.find]
include = ["serialhub*"]

[tool.setuptools.package-data]
serialhub = ["static/*", "static/vendor/*", "static/i18n/*", "i18n/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
